<!-- LÓGICA JAVASCRIPT & FIREBASE MULTI-TENANT COM IVA E LICENÇA -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD-o0URCIdhrv7j_ftbTQ5ZlHzGCrw0QL4",
        authDomain: "gestao-restaurante-a74e4.firebaseapp.com",
        projectId: "gestao-restaurante-a74e4",
        storageBucket: "gestao-restaurante-a74e4.firebasestorage.app",
        messagingSenderId: "882707684467",
        appId: "1:882707684467:web:8c3197794b2c1ba52e1e06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Estado da Aplicação Multi-Tenant
    let codigoEmpresa = "";
    let usuarios = {}, stock = {}, historico = [], clientes = [], despesas = [], movimentacoesStock = [], turnosCaixa = [];
    let mesas = { "Balcão": [] };
    for(let i=1; i<=10; i++) mesas[`Mesa ${i}`] = [];

    let caixaEstado = { aberto: false, fundo: 0, timestampAbertura: null, dataAbertura: null, usuarioAbertura: "" };
    
    let dadosEmpresa = { 
        nome: "RESTAURANTE", 
        nuit: "", 
        endereco: "", 
        telefone: "", 
        slogan: "Obrigado pela preferência!", 
        chaveMestra: "1234",
        aplicarIva: "sim",
        taxaIva: 16
    };

    let usuarioAtual = null;
    let mesaSelecionada = "Balcão";
    let chartInstance = null;
    let unsubscribes = [];

    // Ligar e verificar licença da empresa
    window.carregarPerfisEmpresa = async function() {
        let elCod = document.getElementById('loginCodigoEmpresa');
        let codeInput = elCod ? elCod.value.trim().toUpperCase() : "";
        if(!codeInput) return alert("Por favor, introduza o Código do Restaurante!");

        codigoEmpresa = codeInput;

        try {
            let docLicenca = await getDoc(doc(db, "licencas", codigoEmpresa));

            if (docLicenca && docLicenca.exists()) {
                let dadosLicenca = docLicenca.data();
                let hoje = new Date().toISOString().split('T')[0];

                if (dadosLicenca.status === "suspenso") {
                    document.getElementById('seccaoPerfisEForm').style.display = 'none';
                    document.getElementById('boxContaBloqueada').style.display = 'block';
                    document.getElementById('textoMotivoBloqueio').innerText = dadosLicenca.mensagemBloqueio || 'A mensalidade deste restaurante encontra-se em atraso.';
                    return;
                }

                if (dadosLicenca.validade && dadosLicenca.validade < hoje) {
                    document.getElementById('seccaoPerfisEForm').style.display = 'none';
                    document.getElementById('boxContaBloqueada').style.display = 'block';
                    document.getElementById('textoMotivoBloqueio').innerText = `A sua subscrição venceu no dia ${dadosLicenca.validade}.`;
                    return;
                }
            } else {
                let dataTeste = new Date();
                dataTeste.setDate(dataTeste.getDate() + 7);
                let validadeTeste = dataTeste.toISOString().split('T')[0];

                await setDoc(doc(db, "licencas", codigoEmpresa), {
                    status: "ativo",
                    validade: validadeTeste,
                    mensagemBloqueio: "Acesso suspenso por falta de pagamento.",
                    dataCriacao: new Date().toLocaleString('pt-MZ')
                });
                alert(`🎉 Novo restaurante detetado! Foi ativado um período de teste gratuito de 7 dias (Válido até ${validadeTeste}).`);
            }

            document.getElementById('boxContaBloqueada').style.display = 'none';
            desconectarEscutadores();
            document.getElementById('seccaoPerfisEForm').style.display = 'block';

            // Escutador em tempo real com leitor flexível de perfis
            let unsubUser = onSnapshot(doc(db, "empresas", codigoEmpresa), async (docSnap) => {
                if (docSnap.exists()) {
                    let dadosDoc = docSnap.data();
                    usuarios = {};
                    if (Array.isArray(dadosDoc.usuarios)) {
                        dadosDoc.usuarios.forEach(u => {
                            if (u.nome) {
                                usuarios[u.nome.toLowerCase()] = {
                                    senha: u.senha || "123",
                                    tipo: u.tipo || "vendedor",
                                    foto: u.foto || ""
                                };
                            }
                        });
                    } else if (typeof dadosDoc.usuarios === 'object') {
                        usuarios = dadosDoc.usuarios;
                    }
                } else {
                    usuarios = { "admin": { senha: "123", tipo: "admin", foto: "" } };
                    await setDoc(doc(db, "empresas", codigoEmpresa), { 
                        usuarios: [{ nome: "admin", senha: "123", tipo: "admin", foto: "" }] 
                    }, { merge: true });
                }
                renderizarPerfisLogin();
                if (usuarioAtual && usuarioAtual.tipo === 'admin') renderizarUsuarios();
            });

            unsubscribes.push(unsubUser);

        } catch (erro) {
            console.error("Erro ao verificar licença:", erro);
            alert("Erro ao ligar ao servidor para carregar perfis. Verifique a sua ligação de internet.");
        }
    };

    function iniciarEscutadoresCompletosEmpresa() {
        if(!codigoEmpresa) return;

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "stock"), (docSnap) => {
            stock = docSnap.exists() ? docSnap.data() : {};
            if (usuarioAtual) { atualizarDropdownProdutosCart(); renderizarStock(); verificarAlertasStock(); }
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "movimentacoes_stock"), (docSnap) => {
            movimentacoesStock = docSnap.exists() ? (docSnap.data().lista || []) : [];
            if (usuarioAtual) renderizarMovimentacoesStock();
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "historico"), (docSnap) => {
            historico = docSnap.exists() ? (docSnap.data().lista || []) : [];
            if (usuarioAtual) {
                window.atualizarDashboard();
                if (usuarioAtual.tipo === 'admin') renderizarUsuarios();
            }
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "clientes"), (docSnap) => {
            clientes = docSnap.exists() ? (docSnap.data().lista || []) : [];
            if (usuarioAtual) { renderizarClientes(); atualizarDropdownClientesFiado(); }
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "caixa"), (docSnap) => {
            caixaEstado = docSnap.exists() ? docSnap.data() : { aberto: false, fundo: 0 };
            if (usuarioAtual) renderizarEstadoCaixa();
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "turnos_caixa"), (docSnap) => {
            turnosCaixa = docSnap.exists() ? (docSnap.data().lista || []) : [];
            if (usuarioAtual) renderizarHistoricoTurnos();
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "despesas"), (docSnap) => {
            despesas = docSnap.exists() ? (docSnap.data().lista || []) : [];
            if (usuarioAtual) renderizarEstadoCaixa();
        }));

        unsubscribes.push(onSnapshot(doc(db, "empresas", codigoEmpresa, "dados", "empresa"), (docSnap) => {
            if (docSnap.exists()) {
                dadosEmpresa = Object.assign(dadosEmpresa, docSnap.data());
                preencherCamposEmpresaModal();
            }
        }));
    }

    function desconectarEscutadores() {
        unsubscribes.forEach(unsub => unsub());
        unsubscribes = [];
    }

    function renderizarPerfisLogin() {
        let container = document.getElementById('gridPerfisLogin');
        if (!container) return;
        container.innerHTML = '';

        for (let u in usuarios) {
            let uObj = usuarios[u];
            let avatarHtml = uObj.foto 
                ? `<img src="${uObj.foto}" class="avatar-img" alt="${u}">` 
                : `<div class="avatar-placeholder">${u.charAt(0).toUpperCase()}</div>`;

            let card = document.createElement('div');
            card.className = 'card-perfil-login';
            card.onclick = (e) => window.selecionarPerfilLogin(u, e);
            card.innerHTML = `${avatarHtml}<div style="font-weight:bold; font-size:0.85em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis;">${u}</div>`;
            container.appendChild(card);
        }
    }

    window.selecionarPerfilLogin = function(u, evt) {
        let elUser = document.getElementById('loginUser');
        let elPass = document.getElementById('loginPass');
        if(elUser) elUser.value = u;
        if(elPass) elPass.focus();
        
        document.querySelectorAll('.card-perfil-login').forEach(c => c.classList.remove('ativo'));
        if (evt && evt.currentTarget) evt.currentTarget.classList.add('ativo');
    };

    window.fazerLogin = function() {
        let elUser = document.getElementById('loginUser');
        let elPass = document.getElementById('loginPass');
        let u = elUser ? elUser.value.trim().toLowerCase() : "";
        let p = elPass ? elPass.value : "";

        if(!codigoEmpresa) return alert("Insira primeiro o Código do Restaurante.");

        if (usuarios[u] && usuarios[u].senha === p) {
            usuarioAtual = { nome: u, tipo: usuarios[u].tipo, foto: usuarios[u].foto || "" };
            
            document.getElementById('nomeEmpresaHeader').innerText = codigoEmpresa;
            document.getElementById('nomeUsuarioLogado').innerText = u;
            document.getElementById('cargoUsuarioLogado').innerText = usuarios[u].tipo === 'admin' ? 'Administrador' : 'Operador de Caixa';
            
            let headerAvatar = document.getElementById('headerAvatarBox');
            if(usuarioAtual.foto) {
                headerAvatar.innerHTML = `<img src="${usuarioAtual.foto}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">`;
            } else {
                headerAvatar.innerHTML = `<div style="width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:bold;">${u.charAt(0).toUpperCase()}</div>`;
            }

            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('telaSistema').style.display = 'block';
            
            iniciarEscutadoresCompletosEmpresa();
            configurarPerfil();
            renderizarMesasGrid();
            atualizarDropdownProdutosCart();
            renderizarStock();
            renderizarMovimentacoesStock();
            renderizarEstadoCaixa();
            renderizarClientes();
            window.atualizarDashboard();
            if(usuarioAtual.tipo === 'admin') renderizarUsuarios();
        } else {
            alert("Credenciais inválidas! Verifique o utilizador e a palavra-passe.");
        }
    };

    window.fazerLogout = function() {
        usuarioAtual = null;
        desconectarEscutadores();
        document.getElementById('telaSistema').style.display = 'none';
        document.getElementById('telaLogin').style.display = 'block';
        document.getElementById('loginPass').value = '';
    };

    window.abrirModalResetSenha = function() { document.getElementById('modalResetSenha').style.display = 'block'; };
    window.fecharModalResetSenha = function() {
        document.getElementById('modalResetSenha').style.display = 'none';
        document.getElementById('resetUsuarioNome').value = '';
        document.getElementById('resetChaveMestraInput').value = '';
        document.getElementById('resetNovaSenha').value = '';
    };

    window.solicitarRedefinicaoSenhaChaveMestra = async function() {
        let u = document.getElementById('resetUsuarioNome').value.trim().toLowerCase();
        let chaveEntrada = document.getElementById('resetChaveMestraInput').value.trim();
        let novaP = document.getElementById('resetNovaSenha').value;

        if (!u || !chaveEntrada || !novaP) return alert("Preencha todos os campos.");
        if (!usuarios[u]) return alert("Utilizador não encontrado.");

        let chaveMestraCadastrada = (dadosEmpresa.chaveMestra || "1234").trim();

        if (chaveEntrada === chaveMestraCadastrada) {
            usuarios[u].senha = novaP;
            
            let listaArrayFirestore = [];
            for (let nomeKey in usuarios) {
                listaArrayFirestore.push({
                    nome: nomeKey,
                    senha: usuarios[nomeKey].senha,
                    tipo: usuarios[nomeKey].tipo,
                    foto: usuarios[nomeKey].foto || ""
                });
            }
            await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });

            alert(`A palavra-passe de '${u.toUpperCase()}' foi alterada com sucesso!`);
            window.fecharModalResetSenha();
        } else {
            alert("Chave Mestra Incorreta!");
        }
    };

    function configurarPerfil() {
        let isAdmin = usuarioAtual.tipo === 'admin';
        document.querySelectorAll('.col-admin').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
        document.querySelectorAll('.col-fin').forEach(el => el.style.display = isAdmin ? 'table-cell' : 'none');
        document.getElementById('seccaoEmpresaAdmin').style.display = isAdmin ? 'block' : 'none';
    }

    window.mudarAba = function(abaId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (event && event.target) event.target.classList.add('active');
        document.getElementById(abaId).classList.add('active');
        if(abaId === 'abaDashboard') window.atualizarDashboard();
        if(abaId === 'abaUsuarios' && usuarioAtual.tipo === 'admin') renderizarUsuarios();
    };

    function processarFotoAvatar(file, callback) {
        if (!file) return callback("");
        let reader = new FileReader();
        reader.onload = function(e) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = 120;
                canvas.height = 120;
                ctx.drawImage(img, 0, 0, 120, 120);
                callback(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Criar novo utilizador com salvamento permanente no Firestore
    window.cadastrarUsuario = function() {
        let u = document.getElementById('novoUserNome').value.trim().toLowerCase();
        let p = document.getElementById('novoUserSenha').value;
        let t = document.getElementById('novoUserTipo').value;
        let fileInput = document.getElementById('novoUserFoto').files[0];

        if(!u || !p) return alert("Preencha o nome do utilizador e a palavra-passe!");
        if(usuarios[u]) return alert("Este nome de utilizador já existe!");

        processarFotoAvatar(fileInput, async function(fotoBase64) {
            usuarios[u] = { senha: p, tipo: t, foto: fotoBase64 };

            let listaArrayFirestore = [];
            for (let nomeKey in usuarios) {
                listaArrayFirestore.push({
                    nome: nomeKey,
                    senha: usuarios[nomeKey].senha,
                    tipo: usuarios[nomeKey].tipo,
                    foto: usuarios[nomeKey].foto || ""
                });
            }

            try {
                await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });

                document.getElementById('novoUserNome').value = '';
                document.getElementById('novoUserSenha').value = '';
                document.getElementById('novoUserFoto').value = '';
                alert(`✅ Perfil '${u.toUpperCase()}' criado com sucesso e guardado no servidor!`);
            } catch (erro) {
                console.error("Erro ao guardar utilizador:", erro);
                alert("Não foi possível guardar o novo utilizador no Firestore.");
            }
        });
    };

    window.apagarUsuario = async function(u) {
        if(u === usuarioAtual.nome) return alert("Não pode apagar o seu próprio perfil!");
        if(confirm(`Tem certeza que deseja eliminar o perfil '${u.toUpperCase()}'?`)) {
            delete usuarios[u];

            let listaArrayFirestore = [];
            for (let nomeKey in usuarios) {
                listaArrayFirestore.push({
                    nome: nomeKey,
                    senha: usuarios[nomeKey].senha,
                    tipo: usuarios[nomeKey].tipo,
                    foto: usuarios[nomeKey].foto || ""
                });
            }

            await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });
            alert(`Perfil '${u.toUpperCase()}' removido.`);
        }
    };

    window.redefinirSenhaDiretaAdmin = async function(u) {
        if(usuarioAtual.tipo !== 'admin') return alert("Apenas o Administrador pode redefinir senhas!");
        let novaS = prompt(`ADMINISTRADOR: Digite a nova palavra-passe para '${u.toUpperCase()}':`);
        if(novaS && novaS.trim() !== "") {
            usuarios[u].senha = novaS.trim();

            let listaArrayFirestore = [];
            for (let nomeKey in usuarios) {
                listaArrayFirestore.push({
                    nome: nomeKey,
                    senha: usuarios[nomeKey].senha,
                    tipo: usuarios[nomeKey].tipo,
                    foto: usuarios[nomeKey].foto || ""
                });
            }
            await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });

            alert(`Palavra-passe de ${u.toUpperCase()} alterada com sucesso!`);
        }
    };

    window.alterarFotoUsuarioAdmin = function(u) {
        if(usuarioAtual.tipo !== 'admin') return alert("Apenas o Administrador pode alterar fotos!");
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
            let file = e.target.files[0];
            processarFotoAvatar(file, async function(fotoBase64) {
                if(fotoBase64) {
                    usuarios[u].foto = fotoBase64;

                    let listaArrayFirestore = [];
                    for (let nomeKey in usuarios) {
                        listaArrayFirestore.push({
                            nome: nomeKey,
                            senha: usuarios[nomeKey].senha,
                            tipo: usuarios[nomeKey].tipo,
                            foto: usuarios[nomeKey].foto || ""
                        });
                    }
                    await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });

                    alert(`Foto de perfil de '${u.toUpperCase()}' atualizada!`);
                }
            });
        };
        input.click();
    };

    function renderizarUsuarios() {
        let tbody = document.getElementById('corpoTabelaPerfis');
        if(!tbody) return;
        tbody.innerHTML = '';

        for(let u in usuarios) {
            let userObj = usuarios[u];
            let vendasUser = historico.filter(h => h.tipo === 'venda' && h.usuario === u);
            let totalVendido = vendasUser.reduce((acc, i) => acc + (i.totalVenda || 0), 0);
            let numVendas = vendasUser.length;

            let fotoTd = userObj.foto 
                ? `<img src="${userObj.foto}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">` 
                : `<div style="width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:bold;">${u.charAt(0).toUpperCase()}</div>`;

            tbody.innerHTML += `<tr>
                <td>${fotoTd}</td>
                <td><b style="text-transform:uppercase;">${u}</b></td>
                <td><span class="badge" style="background:${userObj.tipo==='admin'?'var(--primary)':'#6c757d'}; color:white;">${userObj.tipo==='admin'?'Administrador':'Operador'}</span></td>
                <td style="color:var(--success); font-weight:bold;">${totalVendido.toFixed(2)} MT</td>
                <td><b>${numVendas}</b> vendas</td>
                <td>
                    <button class="btn-primary btn-sm" onclick="window.verHistoricoPerfil('${u}')">🔍 Vendas</button>
                    <button class="btn-purple btn-sm" onclick="window.alterarFotoUsuarioAdmin('${u}')">📷 Alterar Foto</button>
                    <button class="btn-warning btn-sm" onclick="window.redefinirSenhaDiretaAdmin('${u}')">🔑 Mudar Senha</button>
                    ${u !== 'admin' ? `<button class="btn-saida btn-sm" onclick="window.apagarUsuario('${u}')">Eliminar</button>` : ''}
                </td>
            </tr>`;
        }
    }

    window.verHistoricoPerfil = function(u) {
        let sec = document.getElementById('seccaoDetalhesPerfil');
        document.getElementById('nomePerfilSelecionado').innerText = u;
        sec.style.display = 'block';

        let tbody = document.getElementById('corpoDetalhesVendasPerfil');
        tbody.innerHTML = '';

        let vendasUser = historico.filter(h => h.tipo === 'venda' && h.usuario === u);

        if(vendasUser.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">Nenhuma venda registada para este perfil.</td></tr>';
            return;
        }

        vendasUser.forEach(v => {
            let resumoItens = v.itens.map(i => `${i.qtd}x ${i.produto}`).join(', ');
            tbody.innerHTML += `<tr>
                <td>${v.data}</td>
                <td>${v.mesa || 'Balcão'}</td>
                <td><span class="badge">${v.metodo}</span></td>
                <td><small>${resumoItens}</small></td>
                <td style="font-weight:bold; color:var(--success);">${v.totalVenda.toFixed(2)} MT</td>
            </tr>`;
        });
    };

    window.fecharDetalhesPerfil = function() {
        document.getElementById('seccaoDetalhesPerfil').style.display = 'none';
    };

    // ================= LÓGICA DE CAIXA E FECHO CEGO =================

    function renderizarEstadoCaixa() {
        let banner = document.getElementById('bannerStatusCaixa');
        let txt = document.getElementById('textoStatusCaixa');
        let secAbrir = document.getElementById('seccaoAbrirCaixa');
        let secAberto = document.getElementById('seccaoCaixaAberto');
        let alertaCaixaFechado = document.getElementById('alertaCaixaFechadoVendas');

        if(caixaEstado.aberto) {
            banner.className = "status-caixa-banner caixa-aberto";
            txt.innerText = `🟢 Caixa Aberto desde ${caixaEstado.dataAbertura || ''} (${caixaEstado.usuarioAbertura || ''})`;
            secAbrir.style.display = 'none';
            secAberto.style.display = 'block';
            if(alertaCaixaFechado) alertaCaixaFechado.style.display = 'none';

            let tAbertura = caixaEstado.timestampAbertura || 0;

            let vendasNum = historico.filter(h => h.tipo === 'venda' && h.metodo === 'Numerário' && (h.timestamp || 0) >= tAbertura)
                                     .reduce((acc, i) => acc + i.totalVenda, 0);
            let totalDesp = despesas.filter(d => (d.timestamp || 0) >= tAbertura)
                                    .reduce((acc, i) => acc + i.valor, 0);

            let saldoEsperado = (caixaEstado.fundo || 0) + vendasNum - totalDesp;

            document.getElementById('cxValFundo').innerText = (caixaEstado.fundo || 0).toFixed(2) + " MT";
            document.getElementById('cxValVendasNum').innerText = vendasNum.toFixed(2) + " MT";
            document.getElementById('cxValDespesas').innerText = totalDesp.toFixed(2) + " MT";
            
            if (usuarioAtual && usuarioAtual.tipo === 'admin') {
                document.getElementById('cxValSaldoGaveta').innerText = saldoEsperado.toFixed(2) + " MT";
            } else {
                document.getElementById('cxValSaldoGaveta').innerText = "*** (Oculto)";
            }
        } else {
            banner.className = "status-caixa-banner caixa-fechado";
            txt.innerText = "🔴 Caixa Encerrado";
            secAbrir.style.display = 'block';
            secAberto.style.display = 'none';
            if(alertaCaixaFechado) alertaCaixaFechado.style.display = 'block';
        }
    }

    window.fecharCaixaTurnoCEGO = async function() {
        let valContado = parseFloat(document.getElementById('inputFechoValorContado').value);

        if(isNaN(valContado) || valContado < 0) {
            return alert("Por favor, introduza o valor contado na gaveta.");
        }

        if(!confirm("Tem certeza que deseja encerrar o turno com o valor contado de " + valContado.toFixed(2) + " MT?")) {
            return;
        }

        let timestampFecho = Date.now();
        let dataFecho = new Date().toLocaleString('pt-MZ');
        let tAbertura = caixaEstado.timestampAbertura || 0;

        let vendasNum = historico.filter(h => {
            let hTime = h.timestamp || 0;
            return h.tipo === 'venda' && h.metodo === 'Numerário' && hTime >= tAbertura;
        }).reduce((acc, i) => acc + (i.totalVenda || 0), 0);

        let totalDesp = despesas.filter(d => {
            let dTime = d.timestamp || 0;
            return dTime >= tAbertura;
        }).reduce((acc, i) => acc + (i.valor || 0), 0);

        let saldoEsperado = (caixaEstado.fundo || 0) + vendasNum - totalDesp;
        let diferenca = valContado - saldoEsperado;

        let registoTurno = {
            id: Date.now(),
            dataAbertura: caixaEstado.dataAbertura || dataFecho,
            dataFecho: dataFecho,
            usuarioFecho: usuarioAtual.nome,
            usuarioAbertura: caixaEstado.usuarioAbertura || 'Desconhecido',
            fundoInicial: caixaEstado.fundo || 0,
            vendasEspécie: vendasNum,
            despesas: totalDesp,
            saldoEsperado: saldoEsperado,
            valorContado: valContado,
            diferenca: diferenca
        };

        turnosCaixa.push(registoTurno);
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "turnos_caixa"), { lista: turnosCaixa });

        caixaEstado = { aberto: false, fundo: 0 };
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "caixa"), caixaEstado);

        document.getElementById('inputFechoValorContado').value = '';

        let msgResultado = `🔒 Turno Encerrado com Sucesso!\n\n` +
            `• Total Vendas em Espécie (Todos os Vendedores): ${vendasNum.toFixed(2)} MT\n` +
            `• Total Despesas: ${totalDesp.toFixed(2)} MT\n` +
            `• Saldo Esperado na Gaveta: ${saldoEsperado.toFixed(2)} MT\n` +
            `• Valor Contado: ${valContado.toFixed(2)} MT\n` +
            `• Diferença: ${diferenca >= 0 ? '+' : ''}${diferenca.toFixed(2)} MT ${diferenca < 0 ? '⚠️ (Quebra de Caixa)' : diferenca > 0 ? '🟢 (Sobra)' : '✅ (Exato)'}`;

        alert(msgResultado);
    };

    window.adicionarAoCarrinho = function() {

            window.mudarAba('abaCaixa');

    window.calcularTroco = function() {
        let itens = mesas[mesaSelecionada] || [];
        let total = itens.reduce((acc, i) => acc + i.subtotal, 0);
        let desc = parseFloat(document.getElementById('cartDesconto').value) || 0;
        let totalFinal = Math.max(0, total - desc);

        let valorEntregue = parseFloat(document.getElementById('cartValorEntregue').value) || 0;
        let troco = Math.max(0, valorEntregue - totalFinal);

        document.getElementById('cartTrocoTexto').innerText = troco.toFixed(2) + " MT";
        return troco;
    };

    window.renderizarCarrinho = function() {
        let tbody = document.getElementById('corpoCarrinho');
        if(!tbody) return;
        tbody.innerHTML = '';
        let itens = mesas[mesaSelecionada] || [];
        let total = 0;

        itens.forEach((item, idx) => {
            total += item.subtotal;
            tbody.innerHTML += `<tr>
                <td>${item.produto.toUpperCase()}</td>
                <td>${item.qtd}</td>
                <td>${item.precoUnit.toFixed(2)} MT</td>
                <td><b>${item.subtotal.toFixed(2)} MT</b></td>
                <td><button class="btn-saida btn-sm" onclick="window.removerItemCarrinho(${idx})">x</button></td>
            </tr>`;
        });

        let desc = parseFloat(document.getElementById('cartDesconto').value) || 0;
        let totalFinal = Math.max(0, total - desc);
        
        let taxaIva = dadosEmpresa.aplicarIva === 'sim' ? (parseFloat(dadosEmpresa.taxaIva) || 16) : 0;
        let subtotalLiq = totalFinal / (1 + (taxaIva / 100));
        let valorIva = totalFinal - subtotalLiq;

        document.getElementById('cartTotalTexto').innerText = totalFinal.toFixed(2) + " MT";
        
        if (dadosEmpresa.aplicarIva === 'sim') {
            document.getElementById('cartSubtotalIvaTexto').innerText = `Base Tributável: ${subtotalLiq.toFixed(2)} MT | IVA (${taxaIva}%): ${valorIva.toFixed(2)} MT`;
        } else {
            document.getElementById('cartSubtotalIvaTexto').innerText = `Isento de IVA`;
        }

        window.calcularTroco();
    };

    // Remoção protegida no carrinho por palavra-passe do Administrador
    window.removerItemCarrinho = function(idx) {
        let itens = mesas[mesaSelecionada] || [];
        let item = itens[idx];
        if (!item) return;

        if (usuarioAtual && usuarioAtual.tipo === 'admin') {
            if (confirm(`ADMINISTRADOR: Confirmar eliminação do item '${item.produto.toUpperCase()}'?`)) {
                mesas[mesaSelecionada].splice(idx, 1);
                renderizarMesasGrid();
                window.renderizarCarrinho();
            }
            return;
        }

        let senhaAdminInput = prompt(`🔒 AUTORIZAÇÃO DE ADMINISTRADOR NECESSÁRIA\n\nO operador '${usuarioAtual.nome.toUpperCase()}' solicitou a remoção do item: ${item.qtd}x ${item.produto.toUpperCase()}.\n\nInsira a palavra-passe de um Administrador para autorizar:`);

        if (!senhaAdminInput) return;

        let autorizacaoValida = false;
        for (let u in usuarios) {
            if (usuarios[u].tipo === 'admin' && usuarios[u].senha === senhaAdminInput.trim()) {
                autorizacaoValida = true;
                break;
            }
        }

        if (autorizacaoValida) {
            mesas[mesaSelecionada].splice(idx, 1);
            renderizarMesasGrid();
            window.renderizarCarrinho();
            alert(`✅ Item '${item.produto.toUpperCase()}' removido com autorização do Administrador.`);
        } else {
            alert("❌ Palavra-passe de Administrador incorreta! Remoção de item cancelada.");
        }
    };

    window.finalizarVendaCarrinho = async function() {
        if (!caixaEstado.aberto) {
            alert("🔴 Venda Bloqueada: É necessário ABRIR O CAIXA antes de fechar vendas e emitir recibos!");
            window.mudarAba('abaCaixa');
            return;
        }

        let itens = mesas[mesaSelecionada] || [];
        if(itens.length === 0) return alert("O carrinho está vazio.");

        let metodo = document.getElementById('cartMetodoPagamento').value;
        let desc = parseFloat(document.getElementById('cartDesconto').value) || 0;
        let totalSemDesc = itens.reduce((acc, i) => acc + i.subtotal, 0);
        let totalVenda = Math.max(0, totalSemDesc - desc);
        let totalCusto = itens.reduce((acc, i) => acc + (i.qtd * i.custoUnit), 0);

        let taxaIva = dadosEmpresa.aplicarIva === 'sim' ? (parseFloat(dadosEmpresa.taxaIva) || 16) : 0;
        let subtotalLiq = totalVenda / (1 + (taxaIva / 100));
        let valorIva = totalVenda - subtotalLiq;

        let valorEntregue = parseFloat(document.getElementById('cartValorEntregue').value) || 0;
        let troco = Math.max(0, valorEntregue - totalVenda);
        let nuitCliente = document.getElementById('cartNuitCliente').value.trim() || 'Consumidor Final';

        let clienteFiado = null;
        if(metodo === 'Fiado') {
            clienteFiado = document.getElementById('cartSelectClienteFiado').value;
            if(!clienteFiado) return alert("Selecione o cliente para registar o fiado.");
        }

        for(let item of itens) {
            stock[item.produto].qtd -= item.qtd;
            stock[item.produto].preco_total -= (item.qtd * item.custoUnit);
            if(stock[item.produto].qtd < 0.01) { stock[item.produto].qtd = 0; stock[item.produto].preco_total = 0; }

            movimentacoesStock.push({
                data: new Date().toLocaleString('pt-MZ'),
                tipo: 'SAÍDA (VENDA)',
                produto: item.produto,
                qtd: item.qtd,
                usuario: usuarioAtual.nome,
                origem: `Venda ${mesaSelecionada} (${metodo})`
            });
        }

        let registo = {
            id: Date.now(),
            data: new Date().toLocaleString('pt-MZ'),
            timestamp: Date.now(),
            usuario: usuarioAtual.nome,
            tipo: 'venda',
            mesa: mesaSelecionada,
            itens,
            desconto: desc,
            totalVenda,
            subtotalLiq,
            valorIva,
            taxaIva,
            nuitCliente,
            totalCusto,
            valorEntregue,
            troco,
            metodo,
            clienteFiado
        };

        if(metodo === 'Fiado') {
            let cIdx = clientes.findIndex(c => c.nome === clienteFiado);
            if(cIdx !== -1) {
                clientes[cIdx].divida = (clientes[cIdx].divida || 0) + totalVenda;
                await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "clientes"), { lista: clientes });
            }
        }

        historico.push(registo);
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "stock"), stock);
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "movimentacoes_stock"), { lista: movimentacoesStock });
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "historico"), { lista: historico });

        imprimirTalão(registo);

        let telWa = document.getElementById('cartTelefoneWa').value.trim();
        if(telWa) {
            let msg = `*${dadosEmpresa.nome || 'RESTAURANTE'}*%0ARecibo: ${registo.data}%0AMesa: ${mesaSelecionada}%0ATotal: ${totalVenda.toFixed(2)} MT%0AValor Dado: ${valorEntregue.toFixed(2)} MT%0ATroco: ${troco.toFixed(2)} MT%0A*Obrigado!*`;
            window.open(`https://wa.me/${telWa}?text=${msg}`, '_blank');
        }

        mesas[mesaSelecionada] = [];
        document.getElementById('cartDesconto').value = 0;
        document.getElementById('cartValorEntregue').value = 0;
        document.getElementById('cartNuitCliente').value = '';
        document.getElementById('cartTelefoneWa').value = '';
        renderizarMesasGrid();
        window.renderizarCarrinho();
        alert("Venda realizada com sucesso!");
    };

        } else {

            document.getElementById('rowModoUnidade').style.display = 'flex';

    window.salvarEntradaStock = async function() {
        let prod = document.getElementById('simplesProduto').value.trim().toLowerCase();
        if(!prod) return alert("Digite o nome do produto.");

        let modoCompra = document.getElementById('simplesModoCompra').value;
        let minAlerta = parseFloat(document.getElementById('simplesMinAlerta').value) || 5;
        let precoVendaUnit = parseFloat(document.getElementById('simplesPrecoVendaUnit').value) || 0;

        let totalUnidades = 0, totalCusto = 0;

        if(modoCompra === 'caixa') {
            let numCaixas = parseFloat(document.getElementById('qtdCaixas').value) || 0;
            let unidCaixa = parseFloat(document.getElementById('unidPorCaixa').value) || 1;
            let valCaixa = parseFloat(document.getElementById('precoCaixa').value) || 0;
            totalUnidades = numCaixas * unidCaixa;
            totalCusto = numCaixas * valCaixa;
        } else {
            totalUnidades = parseFloat(document.getElementById('simplesQtd').value) || 0;
            let custoUnit = parseFloat(document.getElementById('simplesPrecoCusto').value) || 0;
            totalCusto = totalUnidades * custoUnit;
        }

        if(!stock[prod]) stock[prod] = { qtd: 0, preco_total: 0, preco_venda: 0, min_alerta: minAlerta };

        stock[prod].qtd += totalUnidades;
        stock[prod].preco_total += totalCusto;
        stock[prod].min_alerta = minAlerta;
        if(precoVendaUnit > 0) stock[prod].preco_venda = precoVendaUnit;

        movimentacoesStock.push({
            data: new Date().toLocaleString('pt-MZ'),
            tipo: 'ENTRADA (COMPRA)',
            produto: prod,
            qtd: totalUnidades,
            usuario: usuarioAtual.nome,
            origem: modoCompra === 'caixa' ? 'Compra por Caixa/Fardo' : 'Compra Avulsa'
        });

        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "stock"), stock);
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "movimentacoes_stock"), { lista: movimentacoesStock });

        document.getElementById('simplesProduto').value = '';
        alert("Stock e histórico atualizados!");
    };

    function renderizarStock() {
        let tbody = document.getElementById('corpoStock');
        if(!tbody) return;
        tbody.innerHTML = '';
        let isAdmin = usuarioAtual && usuarioAtual.tipo === 'admin';

        for(let p in stock) {
            let item = stock[p];
            let custoMedio = item.qtd > 0 ? (item.preco_total / item.qtd) : 0;
            let precoVenda = item.preco_venda || 0;
            let isCritico = item.qtd <= (item.min_alerta || 5);

            let colFin = isAdmin ? `
                <td>${custoMedio.toFixed(2)} MT</td>
                <td style="color:var(--success); font-weight:bold;">${(precoVenda - custoMedio).toFixed(2)} MT</td>` : '';
            let colAdmin = isAdmin ? `<td><button class="btn-saida btn-sm" onclick="window.apagarProduto('${p}')">Apagar</button></td>` : '';

            tbody.innerHTML += `<tr>
                <td><b>${p.toUpperCase()}</b></td>
                <td class="${isCritico ? 'alerta' : ''}">${item.qtd} ${isCritico ? '⚠️' : ''}</td>
                <td>${item.min_alerta || 5}</td>
                <td><b>${precoVenda.toFixed(2)} MT</b></td>
                ${colFin}
                ${colAdmin}
            </tr>`;
        }
    }

    function renderizarMovimentacoesStock() {
        let tbody = document.getElementById('corpoMovimentacoesStock');
        if(!tbody) return;
        tbody.innerHTML = '';

        if(movimentacoesStock.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#666;">Nenhuma movimentação registada.</td></tr>';
            return;
        }

        movimentacoesStock.slice(-30).reverse().forEach(m => {
            let isEntrada = m.tipo.includes('ENTRADA');
            tbody.innerHTML += `<tr>
                <td>${m.data}</td>
                <td><span class="badge ${isEntrada ? 'badge-entrada' : 'badge-saida'}">${m.tipo}</span></td>
                <td><b>${m.produto.toUpperCase()}</b></td>
                <td style="font-weight:bold; color:${isEntrada ? 'var(--success)' : 'var(--danger)'};">
                    ${isEntrada ? '+' : '-'}${m.qtd}
                </td>
                <td><b style="text-transform:uppercase;">${m.usuario}</b></td>
                <td><small>${m.origem || '-'}</small></td>
            </tr>`;
        });
    }

    function verificarAlertasStock() {
        let temCritico = false;
        for(let p in stock) {
            if(stock[p].qtd <= (stock[p].min_alerta || 5)) { temCritico = true; break; }
        }
        document.getElementById('boxAlertaStockGlobal').style.display = temCritico ? 'block' : 'none';
    }

    window.atualizarDashboard = function() {
        if(!usuarioAtual || usuarioAtual.tipo !== 'admin') return;

        let filtro = document.getElementById('filtroDataTipo').value;
        let agora = new Date();
        
        let histFiltrado = historico.filter(h => {
            if(filtro === 'todos') return true;
            let d = new Date(h.timestamp || Date.now());
            if(filtro === 'hoje') return d.toDateString() === agora.toDateString();
            if(filtro === 'mes') return d.getMonth() === agora.getMonth() && d.getFullYear() === agora.getFullYear();
            return true;
        });

        let totalVendas = 0, totalCOGS = 0;
        let canais = { 'Numerário': 0, 'M-Pesa': 0, 'e-Mola': 0, 'POS': 0, 'Fiado': 0 };
        let topProds = {};

        histFiltrado.forEach(h => {
            if(h.tipo === 'venda') {
                totalVendas += h.totalVenda;
                totalCOGS += h.totalCusto;
                if(h.metodo) canais[h.metodo] = (canais[h.metodo] || 0) + h.totalVenda;

                h.itens.forEach(i => {
                    topProds[i.produto] = (topProds[i.produto] || 0) + i.qtd;
                });
            }
        });

        let totalDesp = despesas.reduce((acc, i) => acc + i.valor, 0);

        document.getElementById('dashTotalVendas').innerText = totalVendas.toFixed(2) + " MT";
        document.getElementById('dashCustoVendas').innerText = totalCOGS.toFixed(2) + " MT";
        document.getElementById('dashDespesasGerais').innerText = totalDesp.toFixed(2) + " MT";
        document.getElementById('dashLucroReal').innerText = (totalVendas - totalCOGS - totalDesp).toFixed(2) + " MT";

        let topSorted = Object.entries(topProds).sort((a,b) => b[1] - a[1]).slice(0, 5);
        let divTop = document.getElementById('listaTopProdutos');
        if(divTop) {
            divTop.innerHTML = '';
            topSorted.forEach(([p, q], idx) => {
                divTop.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span><b>${idx+1}. ${p.toUpperCase()}</b></span>
                    <span class="badge">${q} unidades</span>
                </div>`;
            });
        }

        let tbodyHist = document.getElementById('corpoHistoricoAdmin');
        if(tbodyHist) {
            tbodyHist.innerHTML = '';
            histFiltrado.slice(-20).reverse().forEach(h => {
                let resumo = h.itens ? h.itens.map(i => `${i.qtd}x ${i.produto}`).join(', ') : '';
                tbodyHist.innerHTML += `<tr>
                    <td>${h.data}</td>
                    <td><b style="text-transform:uppercase;">${h.usuario}</b></td>
                    <td><small>${resumo}</small></td>
                    <td><span class="badge">${h.metodo}</span></td>
                    <td style="font-weight:bold; color:var(--success);">${h.totalVenda.toFixed(2)} MT</td>
                </tr>`;
            });
        }

        renderizarGraficoCanais(canais);
    };

    function renderizarGraficoCanais(canais) {
        let elCanvas = document.getElementById('graficoCanaisPay');
        if(!elCanvas) return;
        let ctx = elCanvas.getContext('2d');
        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(canais),
                datasets: [{
                    data: Object.values(canais),
                    backgroundColor: ['#28a745', '#007bff', '#fd7e14', '#6f42c1', '#dc3545']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    window.fazerBackup = function() {
        let usuariosSemSenhas = {};
        for(let u in usuarios) {
            usuariosSemSenhas[u] = { tipo: usuarios[u].tipo, foto: usuarios[u].foto || "" };
        }

        let backupData = {
            codigoEmpresa,
            usuarios: usuariosSemSenhas,
            stock,
            movimentacoesStock,
            historico,
            clientes,
            despesas,
            turnosCaixa,
            dadosEmpresa: {
                nome: dadosEmpresa.nome,
                nuit: dadosEmpresa.nuit,
                endereco: dadosEmpresa.endereco,
                telefone: dadosEmpresa.telefone,
                slogan: dadosEmpresa.slogan,
                aplicarIva: dadosEmpresa.aplicarIva,
                taxaIva: dadosEmpresa.taxaIva
            },
            dataBackup: new Date().toLocaleString('pt-MZ')
        };

        let blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_${codigoEmpresa}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    };

    window.abrirModalQRMenu = function() {
        document.getElementById('modalQRMenu').style.display = 'block';
        let urlSite = window.location.href;
        document.getElementById('textLinkMenu').innerText = urlSite;
        document.getElementById('qrcodeArea').innerHTML = '';
        new QRCode(document.getElementById('qrcodeArea'), { text: urlSite, width: 160, height: 160 });
    };
    window.fecharModalQRMenu = function() { document.getElementById('modalQRMenu').style.display = 'none'; };

    window.exportarVendasExcel = function() {
        let dadosExcel = historico.map(item => ({
            "Empresa": codigoEmpresa,
            "Data": item.data,
            "Utilizador": item.usuario,
            "Mesa": item.mesa || "Balcão",
            "Método": item.metodo,
            "NUIT Cliente": item.nuitCliente || "Consumidor Final",
            "Subtotal Líquido (MT)": item.subtotalLiq || item.totalVenda,
            "IVA (MT)": item.valorIva || 0,
            "Total Venda (MT)": item.totalVenda || 0,
            "Custo COGS (MT)": item.totalCusto || 0
        }));
        let ws = XLSX.utils.json_to_sheet(dadosExcel);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Vendas");
        XLSX.writeFile(wb, `Vendas_${codigoEmpresa}_${Date.now()}.xlsx`);
    };

    window.exportarStockExcel = function() {
        let dadosStock = [];
        for(let p in stock) {
            let item = stock[p];
            let custoMedio = item.qtd > 0 ? (item.preco_total / item.qtd) : 0;
            dadosStock.push({
                "Empresa": codigoEmpresa,
                "Produto": p.toUpperCase(),
                "Stock": item.qtd,
                "Custo Unit. (MT)": custoMedio.toFixed(2),
                "Preço Venda (MT)": (item.preco_venda||0).toFixed(2)
            });
        }
        let ws = XLSX.utils.json_to_sheet(dadosStock);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stock");
        XLSX.writeFile(wb, `Stock_${codigoEmpresa}_${Date.now()}.xlsx`);
    };

    function preencherCamposEmpresaModal() {
        if (document.getElementById('cfgNomeEmpresa')) {
            document.getElementById('cfgNomeEmpresa').value = dadosEmpresa.nome || '';
            document.getElementById('cfgNuit').value = dadosEmpresa.nuit || '';
            document.getElementById('cfgTelefone').value = dadosEmpresa.telefone || '';
            document.getElementById('cfgEndereco').value = dadosEmpresa.endereco || '';
            document.getElementById('cfgSlogan').value = dadosEmpresa.slogan || '';
            document.getElementById('cfgChaveMestra').value = dadosEmpresa.chaveMestra || '1234';
            document.getElementById('cfgAplicarIva').value = dadosEmpresa.aplicarIva || 'sim';
            document.getElementById('cfgTaxaIva').value = dadosEmpresa.taxaIva || 16;
        }
    }

    window.abrirModalDefinicoes = function() {
        document.getElementById('modalDefinicoes').style.display = 'block';
        preencherCamposEmpresaModal();
    };
    window.fecharModalDefinicoes = function() { document.getElementById('modalDefinicoes').style.display = 'none'; };
    
    window.guardarDadosEmpresa = async function() {
        dadosEmpresa = {
            nome: document.getElementById('cfgNomeEmpresa').value.trim() || 'RESTAURANTE',
            nuit: document.getElementById('cfgNuit').value.trim(),
            telefone: document.getElementById('cfgTelefone').value.trim(),
            endereco: document.getElementById('cfgEndereco').value.trim(),
            slogan: document.getElementById('cfgSlogan').value.trim(),
            chaveMestra: document.getElementById('cfgChaveMestra').value.trim() || '1234',
            aplicarIva: document.getElementById('cfgAplicarIva').value,
            taxaIva: parseFloat(document.getElementById('cfgTaxaIva').value) || 16
        };
        await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "empresa"), dadosEmpresa);
        alert("Dados salvos com sucesso!");
    };

    window.mudarMinhaSenha = async function() {
        let p = document.getElementById('inputNovaSenha').value;
        if(!p) return alert("Digite a nova palavra-passe.");
        usuarios[usuarioAtual.nome].senha = p;

        let listaArrayFirestore = [];
        for (let nomeKey in usuarios) {
            listaArrayFirestore.push({
                nome: nomeKey,
                senha: usuarios[nomeKey].senha,
                tipo: usuarios[nomeKey].tipo,
                foto: usuarios[nomeKey].foto || ""
            });
        }
        await setDoc(doc(db, "empresas", codigoEmpresa), { usuarios: listaArrayFirestore }, { merge: true });

        alert("Palavra-passe alterada!");
    };

    window.apagarProduto = async function(p) {
        if(confirm(`Apagar ${p.toUpperCase()}?`)) {
            delete stock[p];
            await setDoc(doc(db, "empresas", codigoEmpresa, "dados", "stock"), stock);
        }
    };
</script>
